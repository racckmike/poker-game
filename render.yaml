# Game server (Socket.IO). One always-on instance: rooms live in memory.
services:
  - type: web
    name: mesa-de-poker
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: https://poker-woad-tau.vercel.app # the page on Vercel
